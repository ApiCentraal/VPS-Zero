# Redis Production Configuration
# Enterprise-grade security hardening

################################## NETWORK #####################################

# Accept connections on all interfaces (Docker handles isolation)
bind 0.0.0.0 ::

# Protected mode (disable since we're using TLS and password)
protected-mode yes

# Port disabled (using TLS port only)
port 0

# TLS port
tls-port 6380

# TLS Configuration - REQUIRED for production
tls-cert-file /data/redis.crt
tls-key-file /data/redis.key
tls-ca-cert-file /data/ca.crt
tls-auth-clients yes
tls-protocols "TLSv1.2 TLSv1.3"
tls-ciphers "HIGH:!aNULL:!MD5:!ADH:!RC4:!3DES"
tls-prefer-server-ciphers yes

# TCP listen() backlog
tcp-backlog 511

# TCP keepalive
tcp-keepalive 300

################################## GENERAL #####################################

# Daemonize (no for Docker)
daemonize no

# PID file
pidfile /var/run/redis.pid

# Log level
loglevel notice

# Log file
logfile /var/log/redis/redis.log

# Databases
databases 16

# Show logo
always-show-logo no

################################## SECURITY ####################################

# Require password (set via command line with env var)
# requirepass is set via command line

# Rename dangerous commands
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command KEYS ""
rename-command CONFIG "CONFIG-b6cd2e8f9a4c3d2e1"
rename-command SHUTDOWN "SHUTDOWN-a7df3e9f0c5d4e3f2"
rename-command DEBUG ""

# ACL (Access Control List) - Redis 6.0+
aclfile /usr/local/etc/redis/users.acl

################################## PERSISTENCE #################################

# RDB Snapshots
save 900 1
save 300 10
save 60 10000

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF (Append Only File)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

################################## REPLICATION #################################

# Master-Replica replication configuration
# replica-announce-ip 192.168.1.100
# replica-announce-port 6380

# Security for replicas
masterauth ${REDIS_PASSWORD}
replica-read-only yes

# Replication timeout
repl-timeout 60

# Disable TCP_NODELAY on replica socket
repl-disable-tcp-nodelay no

# Replication backlog
repl-backlog-size 1mb
repl-backlog-ttl 3600

################################## LIMITS ######################################

# Max clients
maxclients 10000

# Max memory policy
maxmemory 512mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

################################## LAZY FREEING #################################

lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

################################## ADVANCED ####################################

# Hash settings
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# List settings
list-max-ziplist-size -2
list-compress-depth 0

# Set settings
set-max-intset-entries 512

# Sorted set settings
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# HyperLogLog
hll-sparse-max-bytes 3000

# Streams
stream-node-max-bytes 4096
stream-node-max-entries 100

# Active rehashing
activerehashing yes

# Client output buffer limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Frequency of background tasks
hz 10

# AOF rewrite
dynamic-hz yes
aof-rewrite-incremental-fsync yes

# RDB save
rdb-save-incremental-fsync yes

################################## SLOW LOG ####################################

slowlog-log-slower-than 10000
slowlog-max-len 128

################################## LATENCY MONITOR #############################

latency-monitor-threshold 100

################################## EVENT NOTIFICATION ##########################

notify-keyspace-events ""

################################## ADVANCED CONFIG #############################

# Compression
lzf-compress yes

# Active defragmentation
activedefrag yes
active-defrag-ignore-bytes 100mb
active-defrag-threshold-lower 10
active-defrag-threshold-upper 25
active-defrag-cycle-min 5
active-defrag-cycle-max 75
