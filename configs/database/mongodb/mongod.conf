# MongoDB Production Configuration
# Enterprise-grade security hardening

# Network settings
net:
  port: 27017
  bindIp: 0.0.0.0
  maxIncomingConnections: 200
  
  # TLS/SSL Configuration - REQUIRED for production
  tls:
    mode: requireTLS
    certificateKeyFile: /data/configdb/mongodb.pem
    CAFile: /data/configdb/ca.pem
    allowConnectionsWithoutCertificates: false
    allowInvalidCertificates: false
    allowInvalidHostnames: false
  
  # Connection pool
  serviceExecutor: synchronous

# Security settings
security:
  # Enable authorization
  authorization: enabled
  
  # Authentication mechanisms
  # Use SCRAM-SHA-256 (default in MongoDB 4.0+)
  
  # JavaScript execution
  javascriptEnabled: false
  
  # Key file for replica set authentication
  # keyFile: /data/configdb/mongodb-keyfile

# Storage settings
storage:
  dbPath: /data/db
  journal:
    enabled: true
    commitIntervalMs: 100
  
  # Storage engine
  engine: wiredTiger
  
  wiredTiger:
    engineConfig:
      cacheSizeGB: 1
      journalCompressor: snappy
      directoryForIndexes: true
    
    collectionConfig:
      blockCompressor: snappy
    
    indexConfig:
      prefixCompression: true

# Logging
systemLog:
  destination: file
  path: /var/log/mongodb/mongod.log
  logAppend: true
  logRotate: reopen
  verbosity: 0
  
  component:
    accessControl:
      verbosity: 1
    command:
      verbosity: 0

# Process management
processManagement:
  timeZoneInfo: /usr/share/zoneinfo
  fork: false  # Don't fork when running in Docker

# Operational profiling
operationProfiling:
  mode: slowOp
  slowOpThresholdMs: 100
  slowOpSampleRate: 1.0

# Replication settings (for replica sets)
replication:
  replSetName: rs0
  oplogSizeMB: 1024

# Sharding settings (if using sharded cluster)
# sharding:
#   clusterRole: shardsvr

# Enterprise-only features
# auditLog:
#   destination: file
#   format: JSON
#   path: /var/log/mongodb/auditLog.json

# Set parameter options
setParameter:
  # Disable server-side JavaScript
  enableLocalhostAuthBypass: false
  
  # Enhanced security
  authenticationMechanisms: SCRAM-SHA-256
  
  # Connection limits
  connPoolMaxShardedConnsPerHost: 200
  connPoolMaxConnsPerHost: 200
  
  # Performance
  cursorTimeoutMillis: 600000
  
  # Security audit (Enterprise only)
  # auditAuthorizationSuccess: false
